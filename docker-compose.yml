version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medico_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medico
      POSTGRES_PASSWORD: medico_dev_password
      POSTGRES_DB: medico_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medico -d medico_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
